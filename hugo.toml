baseURL = 'https://shennmue.github.io'
relativeURLs = true 
title = "shenblog"
theme = "hugo-blog-awesome"
defaultContentLanguage = "en" 

[markup.goldmark.renderer]
  unsafe = true

############################## English Parameters ##############################
[Languages.en]
  contentDir = "content/en" 
  weight = 1

  # Navigation menu
  [Languages.en.menu]
  [[Languages.en.menu.main]]
    name = 'Home'
    url = '/'
    weight = 10

  [[Languages.en.menu.main]]
    name = 'Categories'
    url = '/categories/'
    weight = 40

  [[Languages.en.menu.main]]
    name = 'About me'
    url = '/posts/whoami'
    weight = 40

# Global site parameters
[Languages.en.params]
  label = "English"
  locale = "en-US"
  sitename = "shenblog"
  defaultColor = "auto"
  mainSections = ['posts']
  dateFormat = "2 January 2006"

  [Languages.en.params.author]
    avatar = "avatar.jpg"
    intro = "Welcome to shenblog"
    name = "Ali Hammoudi"
    description = "In this blog, you will find some of my creations and projects I've worked on, enjoy!"

# Social icons
[[params.socialIcons]]
name = "github"
url = "https://github.com/shennmue"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/ali-hammoudi-rouen/"

